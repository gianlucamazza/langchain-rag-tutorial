line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]
extend-exclude = ["notebooks"]  # Teaching code: kept readable over lint-clean

[lint]
select = ["E", "F", "W", "I", "UP", "B"]

[lint.isort]
known-first-party = ["shared"]

[lint.per-file-ignores]
"shared/prompts.py" = ["E501"]  # Prompt text: wrapping would change the prompt

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
