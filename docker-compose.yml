services:
  # Jupyter notebooks
  notebooks:
    build: .
    container_name: langchain-rag-notebooks
    ports:
      - "8888:8888"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./shared:/app/shared
    restart: unless-stopped

  # FastAPI template (needs vector stores: `make vector-stores`)
  api:
    build: .
    container_name: langchain-rag-api
    command: ["uvicorn", "templates.fastapi.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
